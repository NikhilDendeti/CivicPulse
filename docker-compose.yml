services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: civicpulse
      POSTGRES_PASSWORD: civicpulse
      POSTGRES_DB: civicpulse
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  web:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://civicpulse:civicpulse@db:5432/civicpulse
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes: [media:/app/media]
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://civicpulse:civicpulse@db:5432/civicpulse
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes: [media:/app/media]
    depends_on: [db, redis]
  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://civicpulse:civicpulse@db:5432/civicpulse
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on: [db, redis]
volumes:
  pgdata:
  media:
